    directory: '/'
    schedule:
      interval: monthly
    target-branch: mobile-app

  - package-ecosystem: pip
    directory: '/backend'
    schedule:
      interval: monthly
    target-branch: mobile-app

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    target-branch: mobile-app

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    target-branch: mobile-app
